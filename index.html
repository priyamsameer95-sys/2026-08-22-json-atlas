<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JSON Atlas - Interactive Visualizer</title>
    <script type="text/javascript" src="https://unpkg.com/vis-network/standalone/umd/vis-network.min.js"></script>
    <style>
        :root {
            --bg: #09090b;
            --panel: #18181b;
            --border: #27272a;
            --text: #e4e4e7;
            --primary: #3b82f6;
            --node-obj: #8b5cf6;
            --node-arr: #ec4899;
            --node-val: #10b981;
        }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 0; display: flex; height: 100vh; overflow: hidden; }
        
        #sidebar { width: 350px; background: var(--panel); border-right: 1px solid var(--border); display: flex; flex-direction: column; z-index: 10; box-shadow: 2px 0 10px rgba(0,0,0,0.5); }
        .sidebar-header { padding: 1.5rem; border-bottom: 1px solid var(--border); }
        .sidebar-header h1 { margin: 0; font-size: 1.5rem; letter-spacing: -0.5px; background: linear-gradient(to right, #3b82f6, #8b5cf6); -webkit-background-clip: text; color: transparent; }
        .sidebar-header p { margin: 0.5rem 0 0 0; font-size: 0.85rem; color: #a1a1aa; }
        
        #editor-container { flex: 1; padding: 1rem; display: flex; flex-direction: column; }
        textarea { flex: 1; background: #000; color: #a1a1aa; border: 1px solid var(--border); border-radius: 8px; padding: 1rem; font-family: 'SF Mono', Consolas, monospace; font-size: 0.9rem; resize: none; outline: none; }
        textarea:focus { border-color: var(--primary); color: #fff; }
        
        .controls { padding: 1rem; border-top: 1px solid var(--border); display: flex; gap: 0.5rem; }
        button { flex: 1; background: var(--primary); color: #fff; border: none; padding: 0.75rem; border-radius: 6px; font-weight: 600; cursor: pointer; transition: background 0.2s; }
        button:hover { background: #2563eb; }
        button.secondary { background: #27272a; color: #e4e4e7; }
        button.secondary:hover { background: #3f3f46; }
        
        #error-msg { color: #ef4444; font-size: 0.85rem; padding: 0 1rem 1rem 1rem; margin-top: -0.5rem; display: none; }

        #graph-container { flex: 1; background: var(--bg); position: relative; }
        #network { width: 100%; height: 100%; outline: none; }
        
        .legend { position: absolute; bottom: 2rem; right: 2rem; background: rgba(24, 24, 27, 0.8); backdrop-filter: blur(8px); padding: 1rem; border-radius: 8px; border: 1px solid var(--border); display: flex; flex-direction: column; gap: 0.5rem; font-size: 0.85rem; }
        .legend-item { display: flex; align-items: center; gap: 0.5rem; }
        .dot { width: 12px; height: 12px; border-radius: 50%; }
    </style>
</head>
<body>
    <div id="sidebar">
        <div class="sidebar-header">
            <h1>JSON Atlas</h1>
            <p>Paste JSON to visualize its exact topology.</p>
        </div>
        <div id="editor-container">
            <textarea id="json-input" spellcheck="false">{
  "project": "JSON Atlas",
  "version": "1.0.0",
  "features": [
    "Interactive Graph",
    "AST Parsing",
    "Physics Engine"
  ],
  "metadata": {
    "author": "Autonomous Builder",
    "license": "MIT",
    "dependencies": {
      "vis-network": "^9.1.2"
    }
  },
  "is_awesome": true
}</textarea>
        </div>
        <div id="error-msg">Invalid JSON</div>
        <div class="controls">
            <button class="secondary" onclick="document.getElementById('json-input').value = '{}'; renderGraph();">Clear</button>
            <button onclick="renderGraph()">Render Atlas</button>
        </div>
    </div>
    
    <div id="graph-container">
        <div id="network"></div>
        <div class="legend">
            <div class="legend-item"><div class="dot" style="background: var(--node-obj)"></div> Object</div>
            <div class="legend-item"><div class="dot" style="background: var(--node-arr)"></div> Array</div>
            <div class="legend-item"><div class="dot" style="background: var(--node-val)"></div> Value</div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
